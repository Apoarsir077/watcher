name: slot-watch

on:
  schedule:
    # 每 5 分钟触发一次；每次运行会持续检查约 10 分钟，同一时间只有一个在跑，前一个结束后下一个接上，
    # 所以实际检查间隔约 3 分钟（由下面的 INTERVAL_SECONDS 决定）。
    # 如果只想在日本时间 7:00～23:00 运行，把下面这行换成：  - cron: "*/5 22-23,0-14 * * *"
    - cron: "*/5 * * * *"
  workflow_dispatch:         # 允许在网页上手动点「Run workflow」来测试
    inputs:
      test_mail:
        description: "只发一封测试邮件（不检查空位）"
        type: boolean
        default: false

concurrency:
  group: slot-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      # 手动运行时勾选 test_mail，只发一封测试邮件，用来确认邮箱密码设对了
      - name: Send test mail
        if: ${{ github.event.inputs.test_mail == 'true' }}
        run: python slot_watcher_lite.py --testmail
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

      # 记住已经通知过的空位，避免每 5 分钟重复发同一封邮件
      - name: Restore state
        if: ${{ github.event.inputs.test_mail != 'true' }}
        uses: actions/cache@v4
        with:
          path: state.json
          key: seen-${{ github.run_id }}
          restore-keys: |
            seen-

      - name: Check slots
        if: ${{ github.event.inputs.test_mail != 'true' }}
        run: python slot_watcher_lite.py
        env:
          RUN_MINUTES: "30"        # 每次运行持续检查约 30 分钟
          INTERVAL_SECONDS: "180"  # 每次检查之间间隔约 3 分钟（180 秒）
          CAR_MODELS: "326,101"    # 要监控的车种代码：326=AT1，101=MT所内，105=M1総合。多个用逗号隔开
          EL_ID: ${{ secrets.EL_ID }}
          EL_PW: ${{ secrets.EL_PW }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
